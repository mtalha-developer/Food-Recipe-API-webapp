<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food REcipe App</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body class="bg-black text-light">
    <nav>
      <span class="logo">For Foodies 🔥</span>
      <div class="containerbtn my-3 text-center">
        <button id="russain" type="button" class="btn btn-outline-primary">
          Beef
        </button>
        <button id="british" type="button" class="btn btn-outline-secondary">
          Breakfast
        </button>
        <button id="indian" type="button" class="btn btn-outline-success">
          Chicken
        </button>
        <button id="american" type="button" class="btn btn-outline-danger">
          Dessert
        </button>
        <button id="thai" type="button" class="btn btn-outline-warning">
          SeaFood
        </button>
        <button id="chiniese" type="button" class="btn btn-outline-info">
          Pasta
        </button>
      </div>
    </nav>
    <hr class="hr" />
    <!-- search -->
   <div class="search-container">
  <div class="search">
    <span class="material-symbols-outlined">search</span>
    <input type="text" id="search" placeholder="Search Here" />
  </div>
</div>

<!-- food menu  -->
 <div class="foodmenu">
    
 </div>
